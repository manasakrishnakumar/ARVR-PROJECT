# HTTPS for local use (for example the camera on a phone on your Wi-Fi). Run scripts\make_dev_cert.ps1 first, then:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up --build
# Open https://localhost:8443 (or https://<this computer's IP>:8443) and accept the browser warning (self-signed).
services:
  frontend:
    ports: !override
      - "8443:443"
    volumes:
      - ./frontend/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
