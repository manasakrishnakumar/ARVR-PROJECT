# Local use only: everything stays on this computer. Open http://localhost:8080
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      ARVR_DATABASE_URL: sqlite:////data/arvr.db
    volumes:
      - arvr-data:/data
    expose: ["8000"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
volumes:
  arvr-data:
